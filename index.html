<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syspro, Workspace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23181D27'/><circle cx='11' cy='11' r='3' fill='%230E9384'/><circle cx='22' cy='14' r='3' fill='%23E8EAEF'/><circle cx='13' cy='22' r='3' fill='%23E8EAEF'/><path d='M13 13l7 1M12.5 14l.5 6' stroke='%23E8EAEF' stroke-width='1.6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var saved=localStorage.getItem("syspro-theme");
    var dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme=saved||(dark?"dark":"light");
  }catch(e){document.documentElement.dataset.theme="light";}
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- BOOT SKELETON -->
<div id="boot">
  <div class="bsk-side">
    <div class="sk" style="height:32px;width:150px"></div>
    <div style="height:14px"></div>
    <div class="sk" style="height:26px"></div><div class="sk" style="height:26px"></div><div class="sk" style="height:26px"></div>
    <div class="sk" style="height:26px"></div><div class="sk" style="height:26px"></div>
    <div style="flex:1"></div>
    <div class="sk" style="height:52px"></div>
  </div>
  <div class="bsk-main">
    <div class="sk" style="height:40px"></div>
    <div class="sk" style="height:60px;width:60%"></div>
    <div class="bsk-row">
      <div class="sk" style="flex:.8"></div><div class="sk" style="flex:1.6"></div><div class="sk" style="flex:1"></div>
    </div>
  </div>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="2.4" fill="#0E9384"/><circle cx="17.5" cy="9.5" r="2.4" fill="#E8EAEF"/><circle cx="9" cy="17.5" r="2.4" fill="#E8EAEF"/><path d="M9.2 7.6l6 1.5M8 9.3l.8 5.8" stroke="#E8EAEF" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">Syspro</div>
        <div class="brand-sub">atlas-crew / prod</div>
      </div>
    </div>
    <div class="side-label">Workspace</div>
    <nav id="nav-main"></nav>
    <div class="side-label">General</div>
    <nav id="nav-sec"></nav>
    <div class="side-foot">
      <div class="storage">
        <div class="storage-top"><span>Library</span><span class="mono">4.2 / 10 GB</span></div>
        <div class="storage-bar"><i></i></div>
      </div>
      <div class="usercard" data-action="userMenu">
        <div class="avatar" style="background:#E3F2EF;color:#096A60">AR</div>
        <div style="min-width:0;flex:1">
          <div class="un">Alex Rivera</div>
          <div class="ur">Pro · Product Ops</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A92A6" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-col">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-right">
        <span class="sync"><i></i>synced</span>
        <button class="theme-toggle" id="themeToggle" data-action="toggleTheme" type="button" aria-label="Switch to dark mode" aria-pressed="false" data-tip="Toggle theme">
          <span class="theme-ico theme-sun" aria-hidden="true">☀</span>
          <span class="theme-ico theme-moon" aria-hidden="true">●</span>
          <span class="theme-text">Light</span>
        </button>
        <button class="searchpill" data-action="openPalette">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.3"/><path d="m15.6 15.6 4.9 4.9"/></svg>
          Search tasks, files, apps… <kbd>⌘ K</kbd>
        </button>
        <button class="icon-btn" id="bellBtn" data-action="toggleNotif" data-tip="Notifications" aria-label="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 9.2a5.9 5.9 0 1 0-11.8 0c0 4.6-1.9 5.9-1.9 5.9h15.6s-1.9-1.3-1.9-5.9"/><path d="M10.3 18.9a2 2 0 0 0 3.4 0"/></svg>
          <span class="badge" id="bellBadge"></span>
        </button>
        <button class="icon-btn" data-action="nav" data-page="settings" data-tip="Settings" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.6h8.2M16.6 6.6H20"/><circle cx="14.4" cy="6.6" r="2.1"/><path d="M4 12h2.6M10.9 12H20"/><circle cx="8.7" cy="12" r="2.1"/><path d="M4 17.4h10.2M18.6 17.4H20"/><circle cx="16.4" cy="17.4" r="2.1"/></svg>
        </button>
        <div class="vsep"></div>
        <button class="me-btn" data-action="userMenu">
          <div class="avatar av-sm" style="background:#E3F2EF;color:#096A60;width:26px;height:26px;font-size:10px">AR</div>
          <span class="un">Alex</span>
        </button>
      </div>
    </header>
    <div id="content"></div>
  </div>
</div>

<div id="drawer" role="dialog" aria-label="Task details"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<input type="file" id="fileInput" multiple hidden>

<!--
  Modules load in dependency order (foundational helpers/data first,
  view renderers next, then global event wiring, then boot).
  All modules share the global scope (no bundler needed) — see
  README.md for the full module map and load-order explanation.
-->
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/constants.js"></script>
<script src="js/date-utils.js"></script>
<script src="js/data.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/state.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/notifications.js"></script>
<script src="js/nav.js"></script>
<script src="js/view-home.js"></script>
<script src="js/view-calendar.js"></script>
<script src="js/view-tasks.js"></script>
<script src="js/view-files.js"></script>
<script src="js/view-shortcuts.js"></script>
<script src="js/view-archive.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/palette.js"></script>
<script src="js/theme.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
